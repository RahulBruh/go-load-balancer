# Address clients connect to.
listen: ":8080"

# round_robin | weighted_round_robin | least_connections
strategy: round_robin

backends:
  - url: http://localhost:9001
  - url: http://localhost:9002
  - url: http://localhost:9003

# Passive checks: consecutive failed proxied requests (connection errors or
# 502/503/504) that take a backend out before the next active check. 0 = off.
passive:
  max_fails: 3

# Idempotent requests without a body are retried on up to this many other
# backends after a connection error or a 502/503/504.
retries: 2

timeouts:
  dial: 2s
  response_header: 10s

# Active checks: GET <backend><path> every interval. A backend leaves rotation
# after `fall` consecutive failures and returns after `rise` consecutive passes.
health_check:
  path: /health
  interval: 2s
  timeout: 1s
  rise: 2
  fall: 3
